[package]
name = "novaword-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NovaWord rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
novaword-geom = { workspace = true }
novaword-doc = { workspace = true }
novaword-fonts = { workspace = true }
novaword-layout = { workspace = true }
novaword-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
